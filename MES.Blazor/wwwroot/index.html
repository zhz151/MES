<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MES 制造执行系统</title>
    <base href="/" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <!-- ⚠️ 版本串纪律（2026-09-14）：/css/ 由 nginx 下发 max-age=31536000 immutable，
         内容一改必须同步抬串，否则浏览器一年内不重取（app.css 上次升串在 2026-09-04，之后改过 3 次未抬 → 新样式不下发）。
         MES.Blazor.styles.css（scoped CSS 打包产物，与组件同名不指纹化）同理，改动 .razor.css 后一并抬串。 -->
    <link href="css/app.css?v=13" rel="stylesheet" />
    <link href="MES.Blazor.styles.css?v=6" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        <span id="blazor-error-message">应用加载失败或网络连接断开。</span>
        <a href="/offline" class="reload">查看离线页面</a>
        <a class="dismiss">✕</a>
    </div>
    
    <!-- 关键：先加载 MudBlazor JS，再加载 Blazor -->
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/print.js?v=14"></script>
    <script src="js/table-nav.js?v=12"></script>
    <script src="js/scanner.js?v=5"></script>
    <script src="js/filter-popup.js"></script>
    <script src="js/attachment.js?v=1"></script>
    <script>
        // 抑制浏览器原生「安装应用」横幅：MES 不做 PWA 安装引导（原 js/pwa-install.js 已整文件删除，
        // 其 triggerPwaInstall / getPwaInstallPrompt 为 0 调用死代码），此处只保留这一行。
        // ⚠️ 刻意不调 prompt()：DevTools 会因此打一条 info 级提示「Banner not shown」——属预期、非错误。
        window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); });

        // 响应式布局检测 - 监听窗口大小变化
        (function () {
            var MOBILE_BREAKPOINT = 960;
            function isMobileViewport() {
                if (window.innerWidth < MOBILE_BREAKPOINT) return true;
                // 设备物理屏宽 <=767（真手机无论怎么开“电脑模式”都成立，是钉死移动布局的最可靠信号）
                if (window.matchMedia && window.matchMedia('(max-device-width: 767px)').matches) return true;
                // 手机即使强制“桌面版网站”会把 UA 改写为桌面版（去掉 Android/Mobile/Quark），
                // 但硬件仍是触屏主输入 → 用 pointer:coarse 兜底，仍走移动布局，
                // 避免手机上出现常驻半屏侧栏（MainLayout）。
                if (/Android|iPhone|iPad|iPod|Mobile|Mobi|Windows Phone|Quark|MicroMessenger/i.test(navigator.userAgent)) return true;
                if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) return true;
                // 个别浏览器“桌面版网站”会把 UA 改写、coarse 也可能不稳，
                // 再用触点数兜底：触屏手机必 >0。窗口上限取 1600：
                // 手机“桌面版”viewport 常见 980/1280/1440 都归移动；而真桌面（>=1600）
                // 及带鼠标的触屏一体机不被误伤，仍保持桌面布局。
                if ((navigator.maxTouchPoints || 0) > 0 && window.innerWidth < 1600) return true;
                return false;
            }
            window.checkMobile = isMobileViewport;
            // 桌面宽屏判定（MainLayout 用）：>=1280 才常驻侧栏；否则默认收起、由汉堡展开，
            // 兜底手机被误判进桌面布局时不再出现常驻深色侧栏
            window.isWideDesktopViewport = function () { return window.innerWidth >= 1280; };
            window.listenResize = function (dotnetRef, method) {
                window._resizeRef = dotnetRef;
                window._resizeMethod = method;
                window.addEventListener('resize', window._onResize);
            };
            window.stopListening = function () {
                window.removeEventListener('resize', window._onResize);
                window._resizeRef = null;
                window._resizeMethod = null;
            };
            window._onResize = function () {
                if (window._resizeRef && window._resizeMethod) {
                    var isMobile = isMobileViewport();
                    window._resizeRef.invokeMethodAsync(window._resizeMethod, isMobile);
                }
            };
        })();

        // 横屏提示条（LandscapeHintBanner）多监听器总线：与上面 listenResize 的 _resizeRef 单槽互不干扰。
        // 负责把 orientationchange/resize 通知给 .NET 组件，让它在「仍处移动壳但已转横屏（<700 窄横屏）」时收起。
        //
        // ⚠️ 不可按对象身份 indexOf 去增删 DotNetObjectReference：
        //    blazor.webassembly.js 反序列化 reviver 对 .NET 引用是 `new DotNetObject(id)`（每次跨边界都是新对象），
        //    只有 JS 引用才走 `getWrappedObject()` 缓存复用 —— 同一个 _dotNetRef 在 JS 侧两次到达是不同对象，
        //    indexOf 恒为 -1，stop 永远删不掉，组件销毁（_dotNetRef.Dispose()）后数组里留下僵尸引用，
        //    之后每次 resize 都回调已释放的 id，报 "There is no tracked object with id 'N'"。
        //    同一时刻只存在一个提示条（仅 MobileLayout 渲染、ResponsiveLayout 整壳切换），故按「整体清空」处理。
        window._landscapeHintRefs = [];
        window.listenLandscapeHintRefresh = function (dotnetRef, method) {
            window._landscapeHintRefs = [dotnetRef];
            if (!window._landscapeHintBound) {
                window._landscapeHintBound = true;
                window.addEventListener('orientationchange', window._notifyLandscapeHint);
                window.addEventListener('resize', window._notifyLandscapeHint);
            }
        };
        window.stopLandscapeHintRefresh = function () {
            window._landscapeHintRefs = [];
        };
        window._notifyLandscapeHint = function () {
            var refs = window._landscapeHintRefs;
            for (var i = 0; i < refs.length; i++) {
                // 兜底：dispose 与本事件存在竞态，在途调用可能落到已释放的引用上，吞掉即可（回调仅重算竖屏态）
                refs[i].invokeMethodAsync('OnLandscapeHintChanged').catch(function () { });
            }
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
